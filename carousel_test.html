<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Carousel Labs 2026 INFINITE - Segue</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#C5A059",
                        "background-dark": "#020d17",
                    },
                    fontFamily: {
                        sans: ["Outfit", "sans-serif"],
                    }
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .snap-x-mandatory { scroll-snap-type: x mandatory; }
        .snap-start { scroll-snap-align: start; }
        
        .slide-card {
            transition: all 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .slide-card:not(.active) {
            opacity: 0.3;
            transform: scale(0.96);
            filter: grayscale(1);
        }
        .slide-card.active {
            opacity: 1;
            transform: scale(1);
            filter: grayscale(0);
        }
    </style>
</head>

<body class="bg-background-dark font-sans text-white antialiased overflow-x-hidden">

    <header class="py-16 text-center">
        <p class="text-[10px] tracking-[0.5em] uppercase text-primary font-bold mb-4">Laboratory V4.0 / Infinite Loop
        </p>
        <h1 class="text-5xl font-extralight tracking-tighter italic">Seamless <span
                class="font-normal not-italic">Cycling</span></h1>
    </header>

    <main class="pb-32">
        <section class="mb-32">
            <div class="px-6 mb-12 max-w-7xl mx-auto flex justify-between items-center">
                <div>
                    <h2 class="text-[10px] tracking-[0.3em] uppercase opacity-40 mb-2">Concepto E + INFINITE</h2>
                    <h3 class="text-3xl font-extralight italic text-primary">Zero-Wall Navigation</h3>
                </div>
                <div id="carousel-counter" class="text-[10px] font-bold tracking-[0.4em] opacity-40">01 / 03</div>
            </div>

            <!-- Carrusel Track -->
            <div id="concept-e-track"
                class="flex overflow-x-auto no-scrollbar gap-6 px-[10%] md:px-[12.5%] scroll-smooth snap-x-mandatory">

                <!-- [CLONE] Slide 3 al principio -->
                <div data-index="2" onclick="focusSlide(this, 2)"
                    class="slide-card flex-none w-[80vw] md:w-[75vw] snap-start relative aspect-[16/9] md:aspect-[21/9] overflow-hidden rounded-sm group cursor-pointer border border-white/5">
                    <img src="yacht_cockpit_2026.png" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                    <div class="absolute bottom-10 left-10 transition-all duration-700 content-layer">
                        <span
                            class="text-[10px] tracking-[0.5em] uppercase text-primary font-bold mb-4 block">Tecnología</span>
                        <h4 class="text-4xl md:text-7xl font-extralight tracking-tighter leading-none">CONTROL <br>
                            <span class="italic font-normal">INSTINTIVO</span></h4>
                    </div>
                </div>

                <!-- Slide 1 (Original) -->
                <div data-index="0" onclick="focusSlide(this, 0)"
                    class="slide-card active flex-none w-[80vw] md:w-[75vw] snap-start relative aspect-[16/9] md:aspect-[21/9] overflow-hidden rounded-sm group cursor-pointer border border-white/5">
                    <img src="yacht_aerial_turquoise.png" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                    <div class="absolute bottom-10 left-10 transition-all duration-700 content-layer">
                        <span class="text-[10px] tracking-[0.5em] uppercase text-primary font-bold mb-4 block">Serie
                            X</span>
                        <h4 class="text-4xl md:text-7xl font-extralight tracking-tighter leading-none">EL PODER DE <br>
                            <span class="italic font-normal">LA LIBERTAD</span>
                        </h4>
                    </div>
                </div>

                <!-- Slide 2 (Original) -->
                <div data-index="1" onclick="focusSlide(this, 1)"
                    class="slide-card flex-none w-[80vw] md:w-[75vw] snap-start relative aspect-[16/9] md:aspect-[21/9] overflow-hidden rounded-sm group cursor-pointer border border-white/5">
                    <img src="yacht_interior_salon.png" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                    <div class="absolute bottom-10 left-10 transition-all duration-700 content-layer">
                        <span
                            class="text-[10px] tracking-[0.5em] uppercase text-primary font-bold mb-4 block">Artesanía</span>
                        <h4 class="text-4xl md:text-7xl font-extralight tracking-tighter leading-none">DETALLES QUE <br>
                            <span class="italic font-normal">HABLAN</span>
                        </h4>
                    </div>
                </div>

                <!-- Slide 3 (Original) -->
                <div data-index="2" onclick="focusSlide(this, 2)"
                    class="slide-card flex-none w-[80vw] md:w-[75vw] snap-start relative aspect-[16/9] md:aspect-[21/9] overflow-hidden rounded-sm group cursor-pointer border border-white/5">
                    <img src="yacht_cockpit_2026.png" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                    <div class="absolute bottom-10 left-10 transition-all duration-700 content-layer">
                        <span
                            class="text-[10px] tracking-[0.5em] uppercase text-primary font-bold mb-4 block">Tecnología</span>
                        <h4 class="text-4xl md:text-7xl font-extralight tracking-tighter leading-none">CONTROL <br>
                            <span class="italic font-normal">INSTINTIVO</span>
                        </h4>
                    </div>
                </div>

                <!-- [CLONE] Slide 1 al final -->
                <div data-index="0" onclick="focusSlide(this, 0)"
                    class="slide-card flex-none w-[80vw] md:w-[75vw] snap-start relative aspect-[16/9] md:aspect-[21/9] overflow-hidden rounded-sm group cursor-pointer border border-white/5">
                    <img src="yacht_aerial_turquoise.png" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-transparent to-transparent"></div>
                    <div class="absolute bottom-10 left-10 transition-all duration-700 content-layer">
                        <span class="text-[10px] tracking-[0.5em] uppercase text-primary font-bold mb-4 block">Serie
                            X</span>
                        <h4 class="text-4xl md:text-7xl font-extralight tracking-tighter leading-none">EL PODER DE <br>
                            <span class="italic font-normal">LA LIBERTAD</span>
                        </h4>
                    </div>
                </div>

            </div>

            <div class="mt-12 text-center opacity-20 flex justify-center items-center gap-4">
                <span class="text-[10px] uppercase tracking-[0.4em]">Scroll infinito habilitado</span>
                <div class="h-[1px] w-20 bg-white"></div>
            </div>
        </section>
    </main>

    <script>
        const track = document.getElementById('concept-e-track');
        const counter = document.getElementById('carousel-counter');
        const slides = document.querySelectorAll('.slide-card');
        let isJumping = false;

        // Posicionar inicialmente en el Slide 1 (el segundo elemento, índice 1)
        window.addEventListener('load', () => {
            const initialSlide = slides[1];
            track.scrollLeft = initialSlide.offsetLeft - (window.innerWidth * 0.125);
            initialSlide.classList.add('active');
        });

        function focusSlide(element, index) {
            const offset = (window.innerWidth < 768) ? window.innerWidth * 0.1 : window.innerWidth * 0.125;
            track.scrollTo({
                left: element.offsetLeft - offset,
                behavior: 'smooth'
            });
        }

        track.addEventListener('scroll', () => {
            if (isJumping) return;

            const scrollPos = track.scrollLeft;
            const trackWidth = track.scrollWidth;
            const viewWidth = track.offsetWidth;

            // Lógica de reset para Loop Infinito
            // Si llegamos al final (Clon 1), saltar al Slide 1 Real instantáneamente
            if (scrollPos + viewWidth >= trackWidth - 10) {
                isJumping = true;
                track.style.scrollBehavior = 'auto';
                track.scrollLeft = slides[1].offsetLeft - (viewWidth * 0.125);
                track.style.scrollBehavior = 'smooth';
                setTimeout(() => isJumping = false, 50);
            }

            // Si llegamos al principio (Clon 3), saltar al Slide 3 Real
            if (scrollPos <= 10) {
                isJumping = true;
                track.style.scrollBehavior = 'auto';
                track.scrollLeft = slides[3].offsetLeft - (viewWidth * 0.125);
                track.style.scrollBehavior = 'smooth';
                setTimeout(() => isJumping = false, 50);
            }

            // Actualizar estados visuales (Active/Inactive)
            slides.forEach((slide) => {
                const rect = slide.getBoundingClientRect();
                const center = window.innerWidth / 2;
                if (rect.left < center && rect.right > center) {
                    slide.classList.add('active');
                    const idx = slide.getAttribute('data-index');
                    counter.innerText = `0${parseInt(idx) + 1} / 03`;
                } else {
                    slide.classList.remove('active');
                }
            });
        });
    </script>

</body>

</html>
