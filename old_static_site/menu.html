<!DOCTYPE html>
<html class="dark" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Segue Yachts | Fleet Menu</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c59f59",
                        "background-dark": "#020d17",
                    },
                    fontFamily: {
                        "sans": ["Outfit", "sans-serif"],
                        "serif": ["Riviera Nights", "serif"],
                    },
                },
            },
        }
    </script>
    <style>
        @font-face {
            font-family: 'Riviera Nights';
            src: url('fonts/RivieraNightsTrial-Ultralight.otf') format('opentype');
            font-weight: 200;
            font-style: normal;
        }

        @font-face {
            font-family: 'Riviera Nights';
            src: url('fonts/RivieraNightsTrial-Bold.otf') format('opentype');
            font-weight: 700;
            font-style: normal;
        }

        body {
            background-color: #020d17;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none
        }

        .accordion-content {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }

        .accordion-item.active .accordion-content {
            max-height: 300px;
            opacity: 1;
            margin-top: 1.5rem;
        }

        .series-title {
            font-family: 'Riviera Nights', serif;
            font-size: clamp(3rem, 10vw, 7rem);
            line-height: 1;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.1);
            transition: all 0.4s ease;
            letter-spacing: -0.02em;
            text-transform: uppercase;
        }

        .accordion-item:hover .series-title,
        .accordion-item.active .series-title {
            color: white;
            transform: translateX(10px);
        }

        .coming-soon {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-top: 4px;
        }

        .model-link {
            font-family: 'Riviera Nights', serif;
            font-size: 2rem;
            font-weight: 200;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .model-link:hover {
            color: #c59f59;
            transform: translateY(-2px);
        }

        .model-link.disabled {
            color: rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
        }
    </style>
</head>

<body class="py-24 px-6 md:px-12">
    <section class="max-w-7xl mx-auto">
        <div class="w-full flex flex-col gap-16">
            <div class="flex flex-col mb-8">
                <span
                    class="text-primary text-[10px] font-bold tracking-[0.4em] uppercase mb-4 block leading-none">Descubra
                    Nuestra Flota</span>
                <h1
                    class="font-serif text-5xl md:text-8xl font-extralight tracking-tighter leading-none text-white uppercase">
                    CUATRO SERIES,<br /><span class="italic text-white/50">UN LEGADO</span>
                </h1>
            </div>

            <div class="flex flex-col gap-8 border-t border-white/5 pt-8">
                <!-- X SERIES -->
                <div class="accordion-item" id="item-x">
                    <button onclick="toggleAccordion('item-x')"
                        class="text-left outline-none group focus:outline-none w-full border-b border-white/5 pb-4">
                        <h2 class="series-title">X SERIES</h2>
                    </button>
                    <div class="accordion-content">
                        <div class="flex gap-12 items-start overflow-x-auto no-scrollbar py-4">
                            <div class="flex flex-col shrink-0">
                                <span class="model-link disabled">X3</span>
                                <span class="coming-soon">soon</span>
                            </div>
                            <a href="#" class="model-link shrink-0">X4</a>
                            <a href="#" class="model-link shrink-0">X6</a>
                            <a href="#" class="model-link shrink-0">X7</a>
                            <div class="flex flex-col shrink-0">
                                <span class="model-link disabled">X9</span>
                                <span class="coming-soon">soon</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- XS SERIES -->
                <div class="accordion-item" id="item-xs">
                    <button onclick="toggleAccordion('item-xs')"
                        class="text-left outline-none group focus:outline-none w-full border-b border-white/5 pb-4">
                        <h2 class="series-title">XS SERIES</h2>
                    </button>
                    <div class="accordion-content">
                        <div class="flex gap-12 items-start overflow-x-auto no-scrollbar py-4">
                            <a href="#" class="model-link shrink-0">XS 5</a>
                            <a href="#" class="model-link shrink-0">XS 6</a>
                        </div>
                    </div>
                </div>

                <!-- DS SERIES -->
                <div class="accordion-item" id="item-ds">
                    <button onclick="toggleAccordion('item-ds')"
                        class="text-left outline-none group focus:outline-none w-full border-b border-white/5 pb-4">
                        <h2 class="series-title">DS SERIES</h2>
                    </button>
                    <div class="accordion-content">
                        <div class="flex gap-12 items-start overflow-x-auto no-scrollbar py-4">
                            <div class="flex flex-col shrink-0">
                                <span class="model-link disabled">DS 3</span>
                                <span class="coming-soon">soon</span>
                            </div>
                            <div class="flex flex-col shrink-0">
                                <span class="model-link disabled">DS 4</span>
                                <span class="coming-soon">soon</span>
                            </div>
                            <div class="flex flex-col shrink-0">
                                <span class="model-link disabled">DS 5</span>
                                <span class="coming-soon">soon</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FLY SERIES -->
                <div class="accordion-item" id="item-fly">
                    <button onclick="toggleAccordion('item-fly')"
                        class="text-left outline-none group focus:outline-none w-full border-b border-white/5 pb-4">
                        <h2 class="series-title">FLY SERIES</h2>
                    </button>
                    <div class="accordion-content">
                        <div class="flex gap-12 items-start overflow-x-auto no-scrollbar py-4">
                            <a href="#" class="model-link shrink-0">46</a>
                            <a href="#" class="model-link shrink-0">55</a>
                            <a href="#" class="model-link shrink-0">82</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        function toggleAccordion(id) {
            const item = document.getElementById(id);
            const isActive = item.classList.contains('active');
            document.querySelectorAll('.accordion-item').forEach(el => el.classList.remove('active'));
            if (!isActive) item.classList.add('active');
        }
    </script>
</body>

</html>
